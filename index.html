<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF para HTML Vivo — OlacDev</title>
  <style>
    :root { --bg: #f8fafc; --card: #fff; --text: #0f172a; --muted: #475569; --primary: #0f766e; --border: #cbd5e1; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
    main { max-width: 820px; margin: 0 auto; padding: 24px 16px 48px; }
    textarea { width: 100%; min-height: 140px; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; margin-bottom: 12px; }
    button { background: var(--primary); color: #fff; border: 0; padding: 12px 18px; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-top: 16px; }
    footer { text-align: center; padding: 24px 16px; color: var(--muted); font-size: 0.9rem; border-top: 1px solid var(--border); }
    footer a { color: var(--primary); font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <h1>PDF para HTML Vivo (WCAG 2.2 AA)</h1>
    <p>Cole o texto extraído de um PDF para gerar HTML5 semântico acessível para leitores de tela.</p>
    <textarea id="src"># Edital Público
## Requisitos
- Documento com CPF
- Comprovante de residência</textarea>
    <button id="conv" type="button">Converter para HTML5 Semântico</button>
    <section id="out" aria-live="polite"></section>
  </main>
  <footer>Made by <a href="https://olacdev.com/" target="_blank" rel="noopener noreferrer">OlacDev</a></footer>
  <script type="module">
    import { convertTextToSemanticHtml } from './app.js';
    document.getElementById('conv').addEventListener('click', () => {
      const html = convertTextToSemanticHtml({ rawText: document.getElementById('src').value });
      document.getElementById('out').innerHTML = `<div class="card"><h2>HTML5 Gerado</h2><pre>${html.replace(/</g, '&lt;')}</pre></div>`;
    });
  </script>
</body>
</html>
